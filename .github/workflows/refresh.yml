name: Refrescar datos vivos
on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Descargar datos (REE, MITECO, BCE, Open-Meteo)
        run: python3 ops/refresh_data.py
      - name: Disparadores de actualidad (notas solo si una regla objetiva se activa)
        run: python3 ops/triggers.py
      - name: Barómetro, histórico mensual (actualiza el mes en curso; los cerrados no se tocan)
        run: python3 projects/decidir/barometro.py --snapshot
      - name: Comprobar esquema, Pulso, disparadores y calendario
        run: python3 ops/check_live.py
      - name: Commit si cambió live.json
        id: commit
        run: |
          git config user.name "autolab-bot"
          git config user.email "autolab-bot@users.noreply.github.com"
          git add -N projects/decidir/content/actualidad 2>/dev/null || true
          if git diff --quiet -- projects/decidir/data/live.json projects/decidir/data/barometro_historico.json projects/decidir/content/actualidad; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "live.json y actualidad sin cambios"
          else
            git add projects/decidir/data/live.json projects/decidir/data/barometro_historico.json projects/decidir/content/actualidad
            git commit -m "chore(data): datos vivos y notas del $(date -u +%F) [skip refresh]"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Desplegar (los push con GITHUB_TOKEN no disparan pages.yml)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
